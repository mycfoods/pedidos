<link rel="stylesheet" href="style.css">

<style>

    /* =========================================================
       POS
       SOLO ORGANIZA MENÚ + CARRITO
       NO MODIFICA style.css
    ========================================================= */

    #menu.section {
        padding-top: 110px;
    }

    .pos-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.75fr);
        gap: 18px;
        width: 100%;
        align-items: start;
    }

    .pos-menu-panel,
    .pos-cart-panel {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 18px;
        box-sizing: border-box;
    }

    .pos-menu-panel {
        min-width: 0;
    }

    .pos-cart-panel {
        min-width: 0;
        position: sticky;
        top: 85px;
        max-height: calc(100vh - 105px);
        overflow-y: auto;
    }

    .pos-panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
    }

    .pos-panel-title h3 {
        margin: 0;
        color: var(--text-white);
        font-size: 1rem;
        font-weight: 800;
    }

    .pos-panel-title span {
        color: var(--text-gray);
        font-size: 0.72rem;
    }

    /* CATEGORÍAS */

    #tabs-header-dynamic {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 15px;
    }

    #tabs-header-dynamic .tab-btn {
        border: 1px solid var(--border-color);
        background: var(--bg-main);
        color: var(--text-gray);
        padding: 8px 12px;
        border-radius: 8px;
        font-family: var(--font-main);
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
    }

    #tabs-header-dynamic .tab-btn:hover {
        border-color: var(--accent);
        color: var(--text-white);
    }

    #tabs-header-dynamic .tab-btn.active-cat {
        background: var(--accent);
        color: var(--bg-main);
        border-color: var(--accent);
    }

    /* BOTONERA DE PRODUCTOS */

    #menu-accordion-dynamic {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 9px;
    }

    .pos-product-btn {
        width: 100%;
        min-height: 68px;
        padding: 10px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 9px;
        color: var(--text-white);
        font-family: var(--font-main);
        cursor: pointer;
        text-align: left;
        transition: var(--transition);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 7px;
    }

    .pos-product-btn:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
    }

    .pos-product-btn:active {
        transform: scale(0.98);
    }

    .pos-product-name {
        font-size: 0.78rem;
        line-height: 1.15;
        font-weight: 700;
    }

    .pos-product-price {
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
    }

    .pos-empty-menu {
        grid-column: 1 / -1;
        text-align: center;
        padding: 30px 10px;
        color: var(--text-gray);
        font-size: 0.85rem;
    }

    /* =========================================================
       BOTONES PEDIDO / SALÓN
    ========================================================= */

    .venta-mode-btn {
        flex: 1;
        padding: 10px 14px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-gray);
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        font-family: var(--font-main);
        transition: var(--transition);
    }

    .venta-mode-btn.active {
        background: var(--accent);
        color: var(--bg-main);
        border-color: var(--accent);
    }

    /* =========================================================
       EN PANTALLAS MÁS CHICAS
    ========================================================= */

    @media (max-width: 1050px) {

        .pos-layout {
            grid-template-columns: minmax(0, 1fr) minmax(330px, 0.8fr);
            gap: 12px;
        }

        .pos-menu-panel,
        .pos-cart-panel {
            padding: 14px;
        }

        #menu-accordion-dynamic {
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 7px;
        }

        .pos-product-btn {
            min-height: 62px;
            padding: 8px;
        }

    }

    @media (max-width: 800px) {

        #menu.section {
            padding-top: 100px;
        }

        .pos-layout {
            grid-template-columns: 1fr;
        }

        .pos-cart-panel {
            position: static;
            max-height: none;
            overflow: visible;
        }

    }

</style>

<script>

let carrito = [];
let modoVenta = "pedido";
let categoriaActiva = null;


/* =========================================================
   MODO DE VENTA
========================================================= */

function setModoVenta(modo) {

    modoVenta = modo;

    document.querySelectorAll(".venta-mode-btn").forEach(function (b) {

        b.classList.toggle(
            "active",
            b.dataset.mode === modo
        );

    });


    const camposPedido =
        document.getElementById("campos-pedido");

    const camposSalon =
        document.getElementById("campos-salon");


    if (camposPedido) {

        camposPedido.style.display =
            modo === "pedido"
                ? "block"
                : "none";

    }


    if (camposSalon) {

        camposSalon.style.display =
            modo === "salon"
                ? "block"
                : "none";

    }

}


/* =========================================================
   RENDER MENÚ DINÁMICO
========================================================= */

function renderMenuPagina() {

    const tabsHeader =
        document.getElementById("tabs-header-dynamic");

    const grid =
        document.getElementById("menu-accordion-dynamic");


    if (!tabsHeader || !grid) return;


    const data =
        menuLoad();


    const productos =
        Array.isArray(data.products)
            ? data.products
            : [];


    /* ---------------------------------------------------------
       CATEGORÍAS
    --------------------------------------------------------- */

    const categorias = [];


    productos.forEach(function (producto) {

        const categoria =
            String(producto.category || "Otros").trim();


        if (
            categoria &&
            !categorias.includes(categoria)
        ) {

            categorias.push(categoria);

        }

    });


    if (
        !categoriaActiva ||
        !categorias.includes(categoriaActiva)
    ) {

        categoriaActiva =
            categorias.length
                ? categorias[0]
                : null;

    }


    /* ---------------------------------------------------------
       SIN PRODUCTOS
    --------------------------------------------------------- */

    if (!productos.length) {

        tabsHeader.innerHTML = "";

        grid.innerHTML = `
            <div class="pos-empty-menu">
                <i class="fa-solid fa-utensils"></i>
                <br><br>
                Todavía no hay productos cargados en el menú.
            </div>
        `;

        return;

    }


    /* ---------------------------------------------------------
       BOTONES DE CATEGORÍAS
    --------------------------------------------------------- */

    tabsHeader.innerHTML = "";


    categorias.forEach(function (categoria) {

        const boton =
            document.createElement("button");


        boton.type = "button";

        boton.className =
            "tab-btn" +
            (
                categoria === categoriaActiva
                    ? " active-cat"
                    : ""
            );


        boton.textContent =
            categoria;


        boton.addEventListener(
            "click",
            function () {

                seleccionarCategoriaMenu(
                    categoria
                );

            }
        );


        tabsHeader.appendChild(boton);

    });


    /* ---------------------------------------------------------
       PRODUCTOS
    --------------------------------------------------------- */

    grid.innerHTML = "";


    productos.forEach(function (producto, index) {

        const categoria =
            String(
                producto.category || "Otros"
            ).trim();


        if (
            categoria !== categoriaActiva
        ) {

            return;

        }


        const boton =
            document.createElement("button");


        boton.type = "button";

        boton.className =
            "pos-product-btn";


        const nombre =
            String(
                producto.name || "Producto"
            );


        const precio =
            Number(
                producto.price
            ) || 0;


        const nombreDiv =
            document.createElement("span");


        nombreDiv.className =
            "pos-product-name";


        nombreDiv.textContent =
            nombre;


        const precioDiv =
            document.createElement("span");


        precioDiv.className =
            "pos-product-price";


        precioDiv.textContent =
            cajaFmtMoney(precio);


        boton.appendChild(
            nombreDiv
        );


        boton.appendChild(
            precioDiv
        );


        boton.addEventListener(
            "click",
            function () {

                agregarProductoMenu(
                    index
                );

            }
        );


        grid.appendChild(
            boton
        );

    });


    if (!grid.children.length) {

        grid.innerHTML = `
            <div class="pos-empty-menu">
                No hay productos en esta categoría.
            </div>
        `;

    }

}


/* =========================================================
   SELECCIONAR CATEGORÍA
========================================================= */

function seleccionarCategoriaMenu(categoria) {

    categoriaActiva =
        categoria;


    renderMenuPagina();

}


/* =========================================================
   AGREGAR PRODUCTO DIRECTAMENTE
========================================================= */

function agregarProductoMenu(index) {

    const data =
        menuLoad();


    const productos =
        Array.isArray(data.products)
            ? data.products
            : [];


    const producto =
        productos[index];


    if (!producto) return;


    const nombre =
        String(
            producto.name || "Producto"
        );


    const precio =
        Number(
            producto.price
        ) || 0;


    agregarAlCarrito(
        nombre,
        precio,
        1
    );

}


/* =========================================================
   ACTUALIZAR BOTÓN CARRITO
========================================================= */

function actualizarBotonCarrito() {

    const contador =
        document.getElementById(
            "floating-cart-count"
        );


    if (!contador) return;


    contador.innerText =
        carrito.reduce(
            function (total, item) {

                return total +
                    Number(item.cantidad || 0);

            },
            0
        );

}


/* =========================================================
   IR AL CARRITO
========================================================= */

function irAlCarrito() {

    const destino =
        document.getElementById(
            "carrito"
        );


    if (destino) {

        destino.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

}


/* =========================================================
   AGREGAR AL CARRITO
========================================================= */

function agregarAlCarrito(
    nombre,
    precio,
    cantidad = 1
) {

    const itemExistente =
        carrito.find(
            function (item) {

                return item.nombre === nombre;

            }
        );


    if (itemExistente) {

        itemExistente.cantidad +=
            cantidad;

    } else {

        carrito.push({

            nombre:
                nombre,

            precio:
                Number(precio),

            cantidad:
                cantidad

        });

    }


    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   CAMBIAR CANTIDAD DESDE CARRITO
========================================================= */

function cambiarCantidad(
    index,
    cambio
) {

    if (!carrito[index]) return;


    carrito[index].cantidad +=
        cambio;


    if (
        carrito[index].cantidad <= 0
    ) {

        carrito.splice(
            index,
            1
        );

    }


    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   VACIAR CARRITO
========================================================= */

function vaciarCarrito() {

    carrito = [];


    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   ACTUALIZAR CARRITO
========================================================= */

function actualizarCarritoUI() {

    const container =
        document.getElementById(
            "cart-items"
        );


    const totalEl =
        document.getElementById(
            "cart-total"
        );


    if (!container || !totalEl) return;


    if (!carrito.length) {

        container.innerHTML =
            '<p class="empty-msg">El carrito está vacío.</p>';


        totalEl.innerText =
            "$0";


        return;

    }


    let html = "";

    let total = 0;


    carrito.forEach(
        function (item, index) {

            const subtotal =
                item.precio *
                item.cantidad;


            total +=
                subtotal;


            html += `

                <div class="cart-item-row">

                    <div class="cart-item-info">

                        <strong>
                            ${cajaEscapeHtml(item.nombre)}
                        </strong>

                        <span>

                            $${item.precio.toLocaleString("es-AR")}

                            x ${item.cantidad}

                            =

                            $${subtotal.toLocaleString("es-AR")}

                        </span>

                    </div>


                    <div class="cart-item-controls">

                        <button
                            class="btn-qty"
                            onclick="cambiarCantidad(${index}, -1)"
                        >
                            -
                        </button>


                        <span>
                            ${item.cantidad}
                        </span>


                        <button
                            class="btn-qty"
                            onclick="cambiarCantidad(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;


    totalEl.innerText =
        "$" +
        total.toLocaleString(
            "es-AR"
        );

}


/* =========================================================
   ENTREGA
========================================================= */

function toggleDireccion() {

    const tipoEl =
        document.getElementById(
            "cliente-entrega"
        );


    const direccion =
        document.getElementById(
            "group-direccion"
        );


    if (!tipoEl || !direccion) return;


    direccion.style.display =
        tipoEl.value === "Take Away"
            ? "none"
            : "block";

}


/* =========================================================
   MENÚ DEL DÍA DESDE GOOGLE SHEETS
========================================================= */

const URL_MENU =
"https://script.google.com/macros/s/AKfycby9nZR0UMXbHR71rsV4k6y5iZi_IuptX5CJHQqyQEvfs0D7_4__kD-tnKToRggo1B5W/exec";


async function cargarMenuDesdeGoogle() {

    try {

        const respuesta =
            await fetch(URL_MENU);


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP: " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        if (!datos.menu_dia) {

            throw new Error(
                "No existe menu_dia en la respuesta"
            );

        }


        const menu =
            datos.menu_dia;


        const data =
            menuLoad();


        const productos =
            Array.isArray(data.products)
                ? data.products
                : [];


        const producto =
            productos.find(
                function (p) {

                    return p.name ===
                        "Menú del Día";

                }
            );


        if (producto) {

            if (menu.detalle) {

                producto.desc =
                    menu.detalle;

            }


            if (menu.precio) {

                producto.price =
                    Number(menu.precio);

            }


            menuSave(data);

            renderMenuPagina();

        }

    } catch (error) {

        console.error(
            "Error cargando menú del día:",
            error
        );

    }

}

/* =========================================================

function imprimirComanda() {

    if (impresionEnCurso) {

        console.warn(

        );

    if (carrito.length === 0) {

        alert(
            "El carrito está vacío."

    let nombre,

        direccion,
        horario,

    ===================================================== */

    if (modoVenta === "salon") {

            document.getElementById(

        tipoEntrega =
            "Salón";


        direccion =
            "";


        const ahoraSalon =
            new Date();


        horario =
            ahoraSalon.toLocaleTimeString(
                "es-AR",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }
            );


        pago =
            pagoSalonEl
                ? pagoSalonEl.value
                : "Efectivo";


        notas =
            "";

    } else {

        /* =================================================
           PEDIDO
        ================================================= */

        const nombreEl =
            document.getElementById(
                "cliente-nombre"
            );


        const entregaEl =
            document.getElementById(
                "cliente-entrega"
            );


        const direccionEl =
            document.getElementById(
                "cliente-direccion"
            );


        const horarioEl =
            document.getElementById(
                "cliente-horario"
            );


        const pagoEl =
            document.getElementById(
                "cliente-pago"
            );


        const notasEl =
            document.getElementById(
                "cliente-notas"
            );


        nombre =
            nombreEl
                ? nombreEl.value.trim()
                : "";


        tipoEntrega =
            entregaEl
                ? entregaEl.value
                : "";


        direccion =
            direccionEl
                ? direccionEl.value.trim()
                : "";


        horario =
            horarioEl
                ? horarioEl.value.trim()
                : "";


        pago =
            pagoEl
                ? pagoEl.value
                : "";


        notas =
            notasEl
                ? notasEl.value.trim()
                : "";


        if (!nombre) {

            alert(
                "Ingresá el nombre del cliente."
            );


            if (nombreEl) {

                nombreEl.focus();

            }


            return;

        }


        if (
            tipoEntrega === "Delivery" &&
            !direccion
        ) {

            alert(
                "Ingresá la dirección."
            );


            if (direccionEl) {

                direccionEl.focus();

            }


            return;

        }


        if (!horario) {

            alert(
                "Indicá el horario."
            );


            if (horarioEl) {

                horarioEl.focus();

            }


            return;

        }

    }


    impresionEnCurso =
        true;


    /* =====================================================
       FECHA / HORA
    ===================================================== */

    const ahora =
        new Date();


    const horaPedido =
        ahora.toLocaleTimeString(
            "es-AR",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );


    const fechaPedido =
        ahora.toLocaleDateString(
            "es-AR"
        );


    /* =====================================================
       PRODUCTOS
    ===================================================== */

    let total =
        0;


    let productosTexto =
        "";


    carrito.forEach(
        function (item) {

            const subtotal =
                item.precio *
                item.cantidad;


            total +=
                subtotal;


            let nombreProd =
                item.nombre
                    .replace(/á/g, "a")
                    .replace(/é/g, "e")
                    .replace(/í/g, "i")
                    .replace(/ó/g, "o")
                    .replace(/ú/g, "u")
                    .replace(/ñ/g, "n");


            const precioTexto =
                "$" +
                subtotal.toLocaleString(
                    "es-AR"
                );


            productosTexto +=
                `${item.cantidad} x ${nombreProd}    ${precioTexto}\n`;

        }
    );


    /* =====================================================
       REGISTRAR VENTA EN CAJA
    ===================================================== */

    cajaRegistrarVentaDesdePedido({

        nombre:
            nombre,

        tipoEntrega:
            tipoEntrega,

        pago:
            pago,

        total:
            total

    });


    /* =====================================================
       TICKET
    ===================================================== */

    const tituloTicket =
        modoVenta === "salon"
            ? "VENTA SALON"
            : "COMANDA";


    let ticket = `

HORA:  ${horaPedido}
--------------------------------

ENTREGA: ${tipoEntrega.toUpperCase()}
`;


    if (
        tipoEntrega === "Delivery"
    ) {

        ticket +=
`DIRECCION:
${direccion.toUpperCase()}
`;

    }


    ticket +=
`HORARIO: ${horario}
PAGO:    ${pago}
--------------------------------
PEDIDO:
${productosTexto}--------------------------------
TOTAL: $${total.toLocaleString("es-AR")}
`;


    if (notas) {

        ticket +=
`--------------------------------
OBSERVACIONES:
${notas.toUpperCase()}
`;

    }


    ticket +=
`--------------------------------
     MYCFOODS


`;


    /* =====================================================
       VENTANA DE IMPRESIÓN
    ===================================================== */

    const ventana =
        window.open(
            "",
            "_blank",
            "width=400,height=600"
        );


    if (!ventana) {

        impresionEnCurso =
            false;


        alert(
            "El navegador bloqueó la ventana de impresión."
        );


        return;
