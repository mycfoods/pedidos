<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCFOODS COMANDAS</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Ajustes puntuales: aire arriba del menú + botonera de categorías compacta -->
    <style>
        #menu.section {
            padding-top: 150px;
        }

        .tabs-header {
            gap: 6px;
            margin-bottom: 26px;
        }

        .tab-btn {
            padding: 7px 14px;
            font-size: 0.78rem;
            border-radius: 16px;
        }

        .accordion-header {
            padding: 14px 16px;
        }

        .prod-name {
            font-size: 0.92rem;
        }

        .accordion-body {
            padding: 12px 16px 16px 16px;
        }

        .badge-click {
            font-size: 0.68rem;
            padding: 3px 8px;
        }

        .tab-btn.active-cat {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }

        .venta-mode-btn {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-main);
            transition: var(--transition);
        }

        .venta-mode-btn.active {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }

        /* Layout dividido: menú a la izquierda, carrito a la derecha */
        .pos-layout {
            display: flex;
            gap: 26px;
            align-items: flex-start;
        }

        .pos-menu-col {
            flex: 1.3;
            min-width: 0;
        }

        .pos-cart-col {
            flex: 1;
            min-width: 0;
            position: sticky;
            top: 20px;
        }

        .pos-cart-col .cart-box {
            margin: 0;
        }

        @media (max-width: 900px) {
            .pos-layout {
                flex-direction: column;
            }
            .pos-cart-col {
                position: static;
                width: 100%;
            }
        }

        /* Menú simplificado: filas planas, mismo lenguaje visual que caja.html */
        .menu-list-dynamic {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            transition: var(--transition);
        }

        .menu-item-row:hover {
            border-color: var(--accent);
        }

        .menu-item-name {
            flex: 1;
            min-width: 0;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-white);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-item-price {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            white-space: nowrap;
        }

        .menu-item-btn-add {
            background: var(--accent);
            color: var(--bg-main);
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-item-btn-add:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
 <body>


<nav class="navbar">
    <div class="container logo-container">
        <a href="#menu" class="logo">
            <i class="fa-solid fa-utensils"></i> MYC<span>FOODS</span>
        </a>

    <div class="nav-links">
    <a href="#menu">Menú</a>
    <a href="#carrito">Carrito</a>
    <a href="caja.html">Caja</a>
</div>
    </div>
</nav>

  <!-- SECCIÓN MENÚ (renderizado dinámico desde datos, editable en caja.html) -->
    <section id="menu" class="section">
        <div class="container">
            <div class="section-title">
                <span class="sub-title" id="site-hero-sub">NUESTRA CARTA</span>
                <h2 id="site-hero-title">Menú</h2>
                <p id="site-hero-text">Elegí y armá tu pedido</p>
            </div>

            <div class="pos-layout">
                <!-- COLUMNA MENÚ -->
                <div class="pos-menu-col">
                    <div class="tabs-header" id="tabs-header-dynamic"></div>
                    <div class="menu-list-dynamic" id="menu-accordion-dynamic"></div>
                </div>

                <!-- COLUMNA CARRITO -->
                <div class="pos-cart-col" id="carrito">
                    <div class="cart-box">
                        <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 14px;">
                            <i class="fa-solid fa-cart-shopping" style="color: var(--accent);"></i> Tu pedido
                        </h3>

                        <!-- Lista de Ítems -->
                        <div id="cart-items" class="cart-items-list">
                            <p class="empty-msg">Tu carrito está vacío. ¡Agregá tus platos preferidos!</p>
                        </div>

                        <!-- SELECTOR DE MODO DE VENTA -->
                        <div class="venta-mode-toggle" style="display:flex; gap:8px; margin-top:20px;">
                            <button type="button" class="venta-mode-btn active" data-mode="pedido" onclick="setModoVenta('pedido')">
                                <i class="fa-solid fa-motorcycle"></i> Pedido
                            </button>
                            <button type="button" class="venta-mode-btn" data-mode="salon" onclick="setModoVenta('salon')">
                                <i class="fa-solid fa-utensils"></i> Salón
                            </button>
                        </div>

                        <!-- FORMULARIO DE DATOS DE ENVÍO -->
                        <div class="checkout-form" style="margin-top: 15px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <div id="campos-pedido">
                                <h3 style="color: var(--accent); font-size: 1.1rem; margin-bottom: 15px;">
                                    <i class="fa-solid fa-user-pen"></i> Datos para la Entrega
                                </h3>

                                <div class="form-group" style="margin-bottom: 12px;">
                                    <label for="cliente-nombre" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Nombre y Apellido *</label>
                                    <input type="text" id="cliente-nombre" placeholder="Ej: Maria Perez" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                </div>

                                <div class="form-group" style="margin-bottom: 12px;">
                                    <label for="cliente-entrega" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Tipo de Entrega *</label>
                                    <select id="cliente-entrega" onchange="toggleDireccion()" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                        <option value="Delivery">Delivery (Tigre Centro)</option>
                                        <option value="Take Away">Retiro por local (Luis Pereyra 440)</option>
                                    </select>
                                </div>

                                <div class="form-group" id="group-direccion" style="margin-bottom: 12px;">
                                    <label for="cliente-direccion" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Dirección de Entrega *</label>
                                    <input type="text" id="cliente-direccion" placeholder="Ej: Av. Cánovas 123, Apto 2B" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                </div>

                                <div class="form-group" style="margin-bottom: 12px;">
                                    <label for="cliente-horario" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Horario deseado de Entrega / Retiro *</label>
                                    <input type="time" id="cliente-horario" min="09:00" max="20:00" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                </div>

                                <div class="form-group" style="margin-bottom: 12px;">
                                    <label for="cliente-pago" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Forma de Pago *</label>
                                    <select id="cliente-pago" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="Transferencia">Transferencia</option>
                                        <option value="Tarjeta">Tarjeta de Débito / Crédito</option>
                                    </select>
                                </div>

                                <div class="form-group" style="margin-bottom: 15px;">
                                    <label for="cliente-notas" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Aclaraciones / Notas (Opcional)</label>
                                    <input type="text" id="cliente-notas" placeholder="Ej: Sin aderezo / Timbre no funciona" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                </div>
                            </div>

                            <div id="campos-salon" style="display:none;">
                                <h3 style="color: var(--accent); font-size: 1.1rem; margin-bottom: 15px;">
                                    <i class="fa-solid fa-utensils"></i> Venta rápida en salón
                                </h3>
                                <div class="form-group" style="margin-bottom: 12px;">
                                    <label for="salon-pago" style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Forma de Pago *</label>
                                    <select id="salon-pago" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="Transferencia">Transferencia</option>
                                        <option value="Tarjeta">Tarjeta de Débito / Crédito</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Resumen y Envio -->
                        <div class="cart-summary">
                            <div class="total-row">
                                <span>Total:</span>
                                <span id="cart-total">$0</span>
                            </div>

                            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                                <button class="btn-clear-cart" onclick="vaciarCarrito()">
                                    Vaciar Carrito
                                </button>

                                <button class="btn-send-whatsapp" onclick="imprimirComanda()" style="flex: 1;">
                                    <i class="fa-solid fa-print"></i> Imprimir
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

  
<!-- BOTÓN FLOTANTE DEL CARRITO -->
<!-- BOTÓN FLOTANTE DE WHATSAPP (solo si hay número cargado en Ajustes) -->
<a id="whatsapp-float-btn" href="#" target="_blank" rel="noopener" style="display:none; position:fixed; bottom:95px; right:25px; background-color:#25d366; color:#fff; width:56px; height:56px; border-radius:50%; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 15px rgba(0,0,0,0.5); z-index:998; text-decoration:none;">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<button id="floating-cart-btn" onclick="irAlCarrito()" aria-label="Ver carrito">
    <i class="fa-solid fa-cart-shopping"></i>
    <span id="floating-cart-count">0</span>
</button>
<script src="caja-core.js"></script>
<!-- LÓGICA JAVASCRIPT -->
<script>

let carrito = [];
let modoVenta = "pedido";
let categoriaActiva = null;


/* =========================================================
   MODO DE VENTA (Pedido vs Venta rápida en salón)
========================================================= */

function setModoVenta(modo) {

    modoVenta = modo;

    document.querySelectorAll(".venta-mode-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.mode === modo);
    });

    const camposPedido = document.getElementById("campos-pedido");
    const camposSalon = document.getElementById("campos-salon");

    if (camposPedido) camposPedido.style.display = modo === "pedido" ? "block" : "none";
    if (camposSalon) camposSalon.style.display = modo === "salon" ? "block" : "none";
}


/* =========================================================
   APLICAR AJUSTES DEL SITIO (editables desde caja.html > Ajustes)
========================================================= */
function aplicarConfiguracionSitio() {

    const site = siteLoad();

    const heroSub = document.getElementById("site-hero-sub");
    const heroTitle = document.getElementById("site-hero-title");
    const heroText = document.getElementById("site-hero-text");

    if (heroSub) heroSub.textContent = site.heroSubtitulo;
    if (heroTitle) heroTitle.textContent = site.heroTitulo;
    if (heroText) heroText.textContent = site.heroBajada;

    const entregaDeliveryOpt = document.querySelector('#cliente-entrega option[value="Delivery"]');
    const entregaRetiroOpt = document.querySelector('#cliente-entrega option[value="Take Away"]');

    if (entregaDeliveryOpt) entregaDeliveryOpt.textContent = site.entregaDeliveryLabel;
    if (entregaRetiroOpt) entregaRetiroOpt.textContent = site.entregaRetiroLabel;

    const horarioInput = document.getElementById("cliente-horario");
    if (horarioInput) {
        horarioInput.min = site.horarioMin;
        horarioInput.max = site.horarioMax;
    }

    const metodos = getMetodosPago();
    const opcionesPago = metodos.map(function (m) {
        return '<option value="' + cajaEscapeHtml(m) + '">' + cajaEscapeHtml(m) + '</option>';
    }).join("");

    const clientePagoSelect = document.getElementById("cliente-pago");
    const salonPagoSelect = document.getElementById("salon-pago");

    if (clientePagoSelect) clientePagoSelect.innerHTML = opcionesPago;
    if (salonPagoSelect) salonPagoSelect.innerHTML = opcionesPago;

    const whatsappBtn = document.getElementById("whatsapp-float-btn");
    if (whatsappBtn) {
        if (site.whatsapp) {
            whatsappBtn.href = "https://wa.me/" + site.whatsapp.replace(/[^0-9]/g, "");
            whatsappBtn.style.display = "flex";
        } else {
            whatsappBtn.style.display = "none";
        }
    }
}


/* =========================================================
   RENDER DEL MENÚ (desde datos editables en caja.html)
========================================================= */

function renderMenuPagina() {

    const data = menuLoad();
    const productos = data.products || [];

    const categorias = [];
    productos.forEach(function (p) {
        if (categorias.indexOf(p.category) === -1) categorias.push(p.category);
    });

    if (!categoriaActiva || categorias.indexOf(categoriaActiva) === -1) {
        categoriaActiva = categorias[0] || null;
    }

    const tabsHeader = document.getElementById("tabs-header-dynamic");
    const grid = document.getElementById("menu-accordion-dynamic");

    if (!tabsHeader || !grid) return;

    if (categorias.length === 0) {
        tabsHeader.innerHTML = "";
        grid.innerHTML = '<p style="color: var(--text-gray); text-align:center;">Todavía no hay productos cargados en el menú.</p>';
        return;
    }

    tabsHeader.innerHTML = categorias.map(function (cat) {
        const activo = cat === categoriaActiva ? " active-cat" : "";
        return '<button type="button" class="tab-btn' + activo + '" onclick="seleccionarCategoriaMenu(\'' + cat.replace(/'/g, "\\'") + '\')">' + cajaEscapeHtml(cat) + '</button>';
    }).join("");

    grid.innerHTML = productos.filter(function (p) {
        return p.category === categoriaActiva;
    }).map(function (p) {
        const nombreEscapado = p.name.replace(/'/g, "\\'");
        return '<div class="menu-item-row">' +
            '<span class="menu-item-name">' + cajaEscapeHtml(p.name) + '</span>' +
            '<span class="menu-item-price">' + cajaFmtMoney(p.price) + '</span>' +
            '<button class="menu-item-btn-add" onclick="agregarAlCarrito(\'' + nombreEscapado + '\', ' + p.price + ', 1)" aria-label="Agregar">+</button>' +
            '</div>';
    }).join("");
}

function seleccionarCategoriaMenu(cat) {
    categoriaActiva = cat;
    renderMenuPagina();
}


/* =========================================================
   CARRITO
========================================================= */

function actualizarBotonCarrito() {

    const contador = document.getElementById("floating-cart-count");

    if (!contador) return;

    contador.innerText = carrito.length;
}


/* =========================================================
   IR AL CARRITO (botón flotante)
========================================================= */

function irAlCarrito() {

    const destino = document.getElementById("carrito");

    if (destino) {
        destino.scrollIntoView({ behavior: "smooth" });
    }
}


/* =========================================================
   CANTIDAD DE PRODUCTOS
========================================================= */

function modificarCantidadMenu(btn, cambio) {

    const container = btn.closest(".qty-selector");

    if (!container) return;

    const qtyVal = container.querySelector(".qty-val");

    if (!qtyVal) return;

    let cantidad = parseInt(qtyVal.innerText) || 1;

    cantidad += cambio;

    if (cantidad < 1) {
        cantidad = 1;
    }

    qtyVal.innerText = cantidad;
}


/* =========================================================
   AGREGAR PRODUCTO DESDE EL MENÚ
========================================================= */

function agregarDesdeMenu(btn, nombre, precio) {

    const container = btn.closest(".item-controls-inline");

    if (!container) return;

    const qtyVal = container.querySelector(".qty-v
