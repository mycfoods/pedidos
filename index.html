<style>

    /* =========================================================
       POS PRINCIPAL
    ========================================================= */

    .pos-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(330px, 0.85fr);
        gap: 18px;
        align-items: start;
        width: 100%;
    }

    .pos-menu-panel {
        width: 100%;
    }

    .pos-menu-panel .section-title {
        margin-bottom: 18px;
    }

    .pos-menu-panel .section-title p {
        margin-bottom: 0;
    }


    /* =========================================================
       CATEGORÍAS
    ========================================================= */

    .pos-category-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 16px;
    }

    .pos-category-btn {
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-gray);
        padding: 8px 13px;
        border-radius: 18px;
        font-family: var(--font-main);
        font-size: 0.76rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
    }

    .pos-category-btn:hover {
        color: var(--text-white);
        border-color: var(--accent);
    }

    .pos-category-btn.active {
        background: var(--accent);
        color: var(--bg-main);
        border-color: var(--accent);
    }


    /* =========================================================
       BOTONERA DE PRODUCTOS
    ========================================================= */

    .pos-products-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
    }

    .pos-product-btn {
        min-height: 72px;
        padding: 10px 11px;
        border: 1px solid var(--border-color);
        border-radius: 9px;
        background: var(--bg-card);
        color: var(--text-white);
        font-family: var(--font-main);
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 6px;
    }

    .pos-product-btn:hover {
        border-color: var(--accent);
        background: var(--bg-card-hover);
        transform: translateY(-1px);
    }

    .pos-product-btn:active {
        transform: scale(0.97);

    .pos-product-name {

    }

        color: var(--bg-main);
    }


    /* =========================================================
       CARRITO LATERAL
    ========================================================= */

    .pos-cart-wrapper {
        min-width: 0;
        position: sticky;
        top: 82px;
        max-height: calc(100vh - 95px);
        overflow-y: auto;
    }

    .pos-cart-wrapper .cart-box {

    .pos-cart-wrapper input,

<script>

let carrito = [];
let modoVenta = "pedido";
let categoriaActiva = null;


/* =========================================================
   MODO DE VENTA
========================================================= */

function setModoVenta(modo) {

    modoVenta = modo;

    document.querySelectorAll(".venta-mode-btn").forEach(function (b) {

        b.classList.toggle(
            "active",
            b.dataset.mode === modo
        );

    });


    const camposPedido =
        document.getElementById("campos-pedido");

    const camposSalon =
        document.getElementById("campos-salon");


    if (camposPedido) {

        camposPedido.style.display =
            modo === "pedido"
                ? "block"
                : "none";

    }


    if (camposSalon) {

        camposSalon.style.display =
            modo === "salon"
                ? "block"
                : "none";

    }

}


/* =========================================================
   RENDER DEL MENÚ
   BOTONERA DINÁMICA
========================================================= */

function renderMenuPagina() {

    const data =
        menuLoad();

    const productos =
        data.products || [];


    const categorias = [];


    productos.forEach(function (p) {

        const categoria =
            p.category || "Sin categoría";

        if (
            categorias.indexOf(categoria) === -1
        ) {

            categorias.push(categoria);

        }

    });


    if (
        !categoriaActiva ||
        categorias.indexOf(categoriaActiva) === -1
    ) {

        categoriaActiva =
            categorias[0] || null;

    }


    const tabsHeader =
        document.getElementById(
            "tabs-header-dynamic"
        );


    const grid =
        document.getElementById(
            "menu-accordion-dynamic"
        );


    if (!tabsHeader || !grid) {
        return;
    }


    /* =====================================================
       SIN PRODUCTOS
    ===================================================== */

    if (categorias.length === 0) {

        tabsHeader.innerHTML = "";

        grid.innerHTML = `
            <p style="
                color: var(--text-gray);
                text-align:center;
                grid-column:1/-1;
                padding:30px 10px;
            ">
                Todavía no hay productos cargados en el menú.
            </p>
        `;

        return;
    }


    /* =====================================================
       BOTONES DE CATEGORÍAS
    ===================================================== */

    tabsHeader.innerHTML =
        categorias.map(function (cat) {

            const activo =
                cat === categoriaActiva
                    ? " active"
                    : "";

            return `
                <button
                    type="button"
                    class="pos-category-btn${activo}"
                    data-category="${cajaEscapeHtml(cat)}">

                    ${cajaEscapeHtml(cat)}

                </button>
            `;

        }).join("");


    /* =====================================================
       EVENTOS DE CATEGORÍAS
    ===================================================== */

    tabsHeader
        .querySelectorAll(".pos-category-btn")
        .forEach(function (btn) {

            btn.addEventListener(
                "click",
                function () {

                    seleccionarCategoriaMenu(
                        btn.dataset.category
                    );

                }
            );

        });


    /* =====================================================
       PRODUCTOS DE LA CATEGORÍA ACTIVA
    ===================================================== */

    const productosCategoria =
        productos.filter(function (p) {

            return (
                (p.category || "Sin categoría")
                === categoriaActiva
            );

        });


    /* =====================================================
       BOTONES DE PRODUCTOS
    ===================================================== */

    grid.innerHTML =
        productosCategoria.map(function (p) {

            return `
                <button
                    type="button"
                    class="pos-product-btn">

                    <span class="pos-product-name">
                        ${cajaEscapeHtml(p.name || "Producto")}
                    </span>

                    <span class="pos-product-price">
                        ${cajaFmtMoney(p.price)}
                    </span>

                </button>
            `;

        }).join("");


    /* =====================================================
       CLICK DIRECTO → CARRITO
    ===================================================== */

    grid
        .querySelectorAll(".pos-product-btn")
        .forEach(function (btn, index) {

            const producto =
                productosCategoria[index];


            btn.addEventListener(
                "click",
                function () {

                    if (!producto) {
                        return;
                    }


                    agregarAlCarrito(
                        producto.name,
                        Number(producto.price) || 0,
                        1
                    );


                    /* pequeño feedback visual */

                    btn.classList.add("producto-agregado");


                    setTimeout(function () {

                        btn.classList.remove(
                            "producto-agregado"
                        );

                    }, 180);

                }
            );

        });

}


/* =========================================================
   SELECCIONAR CATEGORÍA
========================================================= */

function seleccionarCategoriaMenu(cat) {

    categoriaActiva = cat;

    renderMenuPagina();

}


/* =========================================================
   BOTÓN FLOTANTE DEL CARRITO
========================================================= */

function actualizarBotonCarrito() {

    const contador =
        document.getElementById(
            "floating-cart-count"
        );


    if (!contador) {
        return;
    }


    const cantidadTotal =
        carrito.reduce(function (total, item) {

            return total + item.cantidad;

        }, 0);


    contador.innerText =
        cantidadTotal;

}


/* =========================================================
   IR AL CARRITO
========================================================= */

function irAlCarrito() {

    const destino =
        document.getElementById("carrito");


    if (destino) {

        destino.scrollIntoView({
            behavior: "smooth"
        });

    }

}


/* =========================================================
   FUNCIONES ANTIGUAS DE MENÚ
   SE MANTIENEN PARA NO ROMPER COMPATIBILIDAD
========================================================= */

function modificarCantidadMenu(btn, cambio) {

    const container =
        btn.closest(".qty-selector");


    if (!container) {
        return;
    }


    const qtyVal =
        container.querySelector(".qty-val");


    if (!qtyVal) {
        return;
    }


    let cantidad =
        parseInt(qtyVal.innerText) || 1;


    cantidad += cambio;


    if (cantidad < 1) {
        cantidad = 1;
    }


    qtyVal.innerText =
        cantidad;

}


function agregarDesdeMenu(btn, nombre, precio) {

    const container =
        btn.closest(".item-controls-inline");


    if (!container) {
        return;
    }


    const qtyVal =
        container.querySelector(".qty-val");


    const cantidad =
        qtyVal
            ? parseInt(qtyVal.innerText) || 1
            : 1;


    agregarAlCarrito(
        nombre,
        precio,
        cantidad
    );


    if (qtyVal) {
        qtyVal.innerText = "1";
    }

}


/* =========================================================
   AGREGAR AL CARRITO
========================================================= */

function agregarAlCarrito(
    nombre,
    precio,
    cantidad = 1
) {

    const itemExistente =
        carrito.find(function (item) {

            return item.nombre === nombre;

        });


    if (itemExistente) {

        itemExistente.cantidad += cantidad;

    } else {

        carrito.push({

            nombre: nombre,

            precio: Number(precio),

            cantidad: cantidad

        });

    }


    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   CAMBIAR CANTIDAD DESDE EL CARRITO
========================================================= */

function cambiarCantidad(index, cambio) {

    if (!carrito[index]) {
        return;
    }


    carrito[index].cantidad +=
        cambio;


    if (
        carrito[index].cantidad <= 0
    ) {

        carrito.splice(
            index,
            1
        );

    }


    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   VACIAR CARRITO
========================================================= */

function vaciarCarrito() {

    carrito = [];

    actualizarCarritoUI();

    actualizarBotonCarrito();

}


/* =========================================================
   ACTUALIZAR CARRITO
========================================================= */

function actualizarCarritoUI() {

    const container =
        document.getElementById(
            "cart-items"
        );


    const totalEl =
        document.getElementById(
            "cart-total"
        );


    if (!container || !totalEl) {
        return;
    }


    if (carrito.length === 0) {

        container.innerHTML =
            '<p class="empty-msg">El carrito está vacío.</p>';

        totalEl.innerText =
            "$0";

        return;
    }


    let html = "";

    let total = 0;


    carrito.forEach(
        function (item, index) {

            const subtotal =
                item.precio *
                item.cantidad;


            total += subtotal;


            html += `

                <div class="cart-item-row">

                    <div class="cart-item-info">

                        <strong>
                            ${cajaEscapeHtml(item.nombre)}
                        </strong>

                        <span>

                            $${item.precio.toLocaleString("es-AR")}

                            x ${item.cantidad}

                            =

                            $${subtotal.toLocaleString("es-AR")}

                        </span>

                    </div>


                    <div class="cart-item-controls">

                        <button
                            class="btn-qty"
                            onclick="cambiarCantidad(${index}, -1)">

                            -

                        </button>


                        <span>
                            ${item.cantidad}
                        </span>


                        <button
                            class="btn-qty"
                            onclick="cambiarCantidad(${index}, 1)">

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;


    totalEl.innerText =
        "$" +
        total.toLocaleString("es-AR");

}

/* =========================================================
   MENÚ DEL DÍA DESDE GOOGLE SHEETS
========================================================= */

const URL_MENU =
"https://script.google.com/macros/s/AKfycby9nZR0UMXbHR71rsV4k6y5iZi_IuptX5CJHQqyQEvfs0D7_4__kD-tnKToRggo1B5W/exec";


async function cargarMenuDesdeGoogle() {

    try {

        const respuesta =
            await fetch(URL_MENU);


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP: " +
                respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        if (!datos.menu_dia) {

            throw new Error(
                "No existe menu_dia en la respuesta"
            );

        }


        const menu =
            datos.menu_dia;


        const data =
            menuLoad();


        const producto =
            data.products.find(
                function (p) {

                    return p.name ===
                        "Menú del Día";

                }
            );


        if (producto) {

            if (menu.detalle) {

                producto.desc =
                    menu.detalle;

            }


            if (menu.precio) {

                producto.price =
                    Number(menu.precio);

            }


            menuSave(data);

            renderMenuPagina();

        }


    } catch (error) {

        console.error(
            "Error cargando menú del día:",
            error
        );

    }

}
