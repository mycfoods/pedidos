    <!-- Ajustes puntuales: aire arriba del menú + botonera de categorías compacta -->
    <style>
        #menu.section {

        }

        .accordion-header {

        .badge-click {

        .tab-btn.active-cat {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }

        .venta-mode-btn {
            flex: 1;

            background: var(--bg-card);
            border: 1px solid var(--border-color);

            color: var(--text-gray);

            border-color: var(--accent);
        }

        .nav-links { flex-wrap: wrap; row-gap: 8px; }

        .nav-dropdown { position: relative; }
        .nav-dropdown-btn {
            background: none; border: none; color: var(--text-white); font-weight: 600;
            font-size: 0.9rem; cursor: pointer; font-family: var(--font-main);

/* PANEL DE MENÚ Y CARRITO */
.pos-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 20px;
    align-items: start;
    width: 100%;
}

.pos-menu-col {
    min-width: 0;
    width: 100%;
}

.pos-cart-col {
    width: 350px;
    min-width: 0;
    position: sticky;
    top: 12px;
    align-self: start;
}

.pos-cart-col .cart-box {
    width: 100%;
    height: auto;
    max-height: none;
    margin: 0;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: visible;
}

.pos-cart-col .cart-box > h3 {
    flex-shrink: 0;
    margin-bottom: 8px !important;
}

.pos-cart-col .cart-items-list {
    max-height: 100px;
    overflow-y: auto;
    flex-shrink: 0;
}

.pos-cart-col .venta-mode-toggle {
    display: flex;
    flex-shrink: 0;
    gap: 8px;
    margin-top: 8px !important;
}

.pos-cart-col .checkout-form {
    flex: none;
    min-height: auto;
    overflow: visible;
    margin-top: 8px !important;
    padding-top: 8px !important;
}

.pos-cart-col #campos-pedido {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 8px;
    row-gap: 0;
}

.pos-cart-col #campos-pedido h3 {
    grid-column: 1 / -1;
    font-size: 0.9rem !important;
    margin-bottom: 7px !important;
}

.pos-cart-col #campos-pedido .form-group {
    min-width: 0;
    margin-bottom: 7px !important;
}

.pos-cart-col #campos-pedido .form-group:nth-of-type(1),
.pos-cart-col #campos-pedido .form-group:nth-of-type(3) {
    grid-column: 1;
}

.pos-cart-col #campos-pedido .form-group:nth-of-type(2),
.pos-cart-col #campos-pedido .form-group:nth-of-type(4) {
    grid-column: 2;
}

.pos-cart-col #campos-pedido .form-group:nth-of-type(n+5) {
    grid-column: 1 / -1;
}

.pos-cart-col .form-group label {
    display: block;
    font-size: 0.72rem !important;
    margin-bottom: 3px !important;
}

.pos-cart-col .form-group input,
.pos-cart-col .form-group select {
    width: 100%;
    min-width: 0;
    padding: 7px !important;
    font-size: 0.78rem !important;
    box-sizing: border-box;
}

.pos-cart-col .cart-summary {
    flex-shrink: 0;
    margin-top: 8px;
    padding-top: 8px;
    background: var(--bg-card);
    position: relative;
    z-index: 5;
}

.pos-cart-col .cart-item-row {
    padding: 5px 0;
}

@media (max-width: 900px) {
    .pos-layout {
        grid-template-columns: 1fr;
    }

    .pos-cart-col {
        position: static;
        width: 100%;
    }

    .pos-cart-col #campos-pedido {
        display: block;
    }
}

        /* Menú de un toque: cada producto es un botón compacto (solo el nombre). Un toque = se suma al carrito. */
   .menu-list-dynamic {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

        .menu-item-btn {

.menu-item-price {

        .tab-btn.tab-manual {

        .manual-box {

            font-weight: 800;
            cursor: pointer;
        }

        .manual-box .manual-btn:hover {
            background: var(--accent-hover);
        }
    </style>

<script>

let carrito = [];
let modoVenta = "pedido";
let categoriaActiva = null;


/* =========================================================
   MODO DE VENTA (Pedido vs Venta rápida en salón)
========================================================= */

function setModoVenta(modo) {

    modoVenta = modo;

    document.querySelectorAll(".venta-mode-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.mode === modo);
    });

    const camposPedido = document.getElementById("campos-pedido");
    const camposSalon = document.getElementById("campos-salon");

    if (camposPedido) camposPedido.style.display = modo === "pedido" ? "block" : "none";
    if (camposSalon) camposSalon.style.display = modo === "salon" ? "block" : "none";
}


/* =========================================================
   APLICAR AJUSTES DEL SITIO (editables desde caja.html > Ajustes)
========================================================= */
function aplicarConfiguracionSitio() {

    const site = siteLoad();

    const heroSub = document.getElementById("site-hero-sub");
    const heroTitle = document.getElementById("site-hero-title");
    const heroText = document.getElementById("site-hero-text");

    if (heroSub) heroSub.textContent = site.heroSubtitulo;
    if (heroTitle) heroTitle.textContent = site.heroTitulo;
    if (heroText) heroText.textContent = site.heroBajada;

    const entregaDeliveryOpt = document.querySelector('#cliente-entrega option[value="Delivery"]');
    const entregaRetiroOpt = document.querySelector('#cliente-entrega option[value="Take Away"]');

    if (entregaDeliveryOpt) entregaDeliveryOpt.textContent = site.entregaDeliveryLabel;
    if (entregaRetiroOpt) entregaRetiroOpt.textContent = site.entregaRetiroLabel;

    const horarioInput = document.getElementById("cliente-horario");
    if (horarioInput) {
        horarioInput.min = site.horarioMin;
        horarioInput.max = site.horarioMax;
    }

    const metodos = getMetodosPago();
    const opcionesPago = metodos.map(function (m) {
        return '<option value="' + cajaEscapeHtml(m) + '">' + cajaEscapeHtml(m) + '</option>';
    }).join("");

    const clientePagoSelect = document.getElementById("cliente-pago");
    const salonPagoSelect = document.getElementById("salon-pago");

    if (clientePagoSelect) clientePagoSelect.innerHTML = opcionesPago;
    if (salonPagoSelect) salonPagoSelect.innerHTML = opcionesPago;

    const whatsappBtn = document.getElementById("whatsapp-float-btn");
    if (whatsappBtn) {
        if (site.whatsapp) {
            whatsappBtn.href = "https://wa.me/" + site.whatsapp.replace(/[^0-9]/g, "");
            whatsappBtn.style.display = "flex";
        } else {
            whatsappBtn.style.display = "none";
        }
    }
}


/* =========================================================
   RENDER DEL MENÚ (desde datos editables en caja.html)
========================================================= */

const CAT_MANUAL = "__manual__";
let menuProductosVista = [];

function renderMenuPagina() {

    const data = menuLoad();
    const productos = data.products || [];

    const categorias = [];
    productos.forEach(function (p) {
        if (categorias.indexOf(p.category) === -1) categorias.push(p.category);
    });

    if (categoriaActiva !== CAT_MANUAL && (!categoriaActiva || categorias.indexOf(categoriaActiva) === -1)) {
        categoriaActiva = categorias[0] || CAT_MANUAL;
    }

    const tabsHeader = document.getElementById("tabs-header-dynamic");
    const grid = document.getElementById("menu-accordion-dynamic");

    if (!tabsHeader || !grid) return;

    tabsHeader.innerHTML = categorias.map(function (cat) {
        const activo = cat === categoriaActiva ? " active-cat" : "";
        return '<button type="button" class="tab-btn' + activo + '" onclick="seleccionarCategoriaMenu(\'' + cat.replace(/'/g, "\\'") + '\')">' + cajaEscapeHtml(cat) + '</button>';
    }).join("") +
        '<button type="button" class="tab-btn tab-manual' + (categoriaActiva === CAT_MANUAL ? " active-cat" : "") + '" onclick="seleccionarCategoriaMenu(\'' + CAT_MANUAL + '\')"><i class="fa-solid fa-pen"></i> Otro importe</button>';

    if (categoriaActiva === CAT_MANUAL) {
        menuProductosVista = [];
        grid.innerHTML =
            '<div class="manual-box">' +
            '<div class="manual-title">Cobrá un importe fuera de la carta: se suma al carrito como "Otro importe".</div>' +
            '<input type="text" id="manual-desc" maxlength="60" placeholder="Descripción (opcional)" onkeydown="if(event.key===\'Enter\'){agregarImporteManual();}">' +
            '<input type="number" id="manual-importe" inputmode="decimal" min="0" step="any" placeholder="Importe $" onkeydown="if(event.key===\'Enter\'){agregarImporteManual();}">' +
            '<button type="button" class="manual-btn" onclick="agregarImporteManual()">Agregar al carrito</button>' +
            '</div>';
        return;
    }

    menuProductosVista = productos.filter(function (p) {
        return p.category === categoriaActiva;
    });

    if (menuProductosVista.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-gray); text-align:center; grid-column:1/-1;">Todavía no hay productos cargados en el menú.</p>';
        return;
    }

 grid.innerHTML = menuProductosVista.map(function (p, i) {
    return '<button type="button" class="menu-item-btn" data-i="' + i + '" onclick="tocarProducto(' + i + ', this)">' +
        '<span>' + cajaEscapeHtml(p.name) + '</span>' +
        '<span class="menu-item-price">$' + Number(p.price).toLocaleString("es-AR") + '</span>' +
        '<span class="menu-item-badge" hidden></span>' +
        '</button>';
}).join("");

}

/* Un toque sobre el nombre = suma 1 al carrito */
function tocarProducto(i, btn) {
    const p = menuProductosVista[i];
    if (!p) return;
    agregarAlCarrito(p.name, p.price, 1);
    if (btn) {
        btn.classList.add("just-added");
        setTimeout(function () { btn.classList.remove("just-added"); }, 160);
    }
}

/* Cantidad ya cargada en el carrito, sobre cada botón del menú */
function actualizarBadgesMenu() {
    document.querySelectorAll(".menu-item-btn").forEach(function (btn) {
        const p = menuProductosVista[Number(btn.dataset.i)];
        const badge = btn.querySelector(".menu-item-badge");
        if (!p || !badge) return;
        let cant = 0;
        carrito.forEach(function (it) {
            if (it.nombre === p.name && it.precio === Number(p.price)) cant += it.cantidad;
        });
        if (cant > 0) { badge.textContent = cant; badge.hidden = false; }
        else { badge.hidden = true; }
    });
}

/* Importe fuera de la carta: se suma al carrito */
function agregarImporteManual() {
    const descEl = document.getElementById("manual-desc");
    const impEl = document.getElementById("manual-importe");
    if (!impEl) return;

    const importe = parseFloat(String(impEl.value).replace(",", "."));
    if (!importe || importe <= 0) {
        alert("Ingresá un importe válido.");
        impEl.focus();
        return;
    }

    const desc = descEl ? descEl.value.replace(/[<>]/g, "").trim() : "";
    const nombre = desc ? "Otro importe: " + desc : "Otro importe";

    agregarAlCarrito(nombre, importe, 1, true);

    if (descEl) descEl.value = "";
    impEl.value = "";
    impEl.focus();
}

function seleccionarCategoriaMenu(cat) {

    renderMenuPagina();
}

   CARRITO

/* =========================================================
   CANTIDAD DE PRODUCTOS
========================================================= */

function modificarCantidadMenu(btn, cambio) {

    const container = btn.closest(".qty-selector");

    if (!container) return;

    const qtyVal = container.querySelector(".qty-val");

    if (!qtyVal) return;

    let cantidad = parseInt(qtyVal.innerText) || 1;

    cantidad += cambio;

    if (cantidad < 1) {
        cantidad = 1;
    }

    qtyVal.innerText = cantidad;
}


/* =========================================================
   AGREGAR PRODUCTO DESDE EL MENÚ
========================================================= */

function agregarDesdeMenu(btn, nombre, precio) {

    const container = btn.closest(".item-controls-inline");

    if (!container) return;

    const qtyVal = container.querySelector(".qty-val");

    const cantidad = qtyVal
        ? parseInt(qtyVal.innerText) || 1
        : 1;

    agregarAlCarrito(nombre, precio, cantidad);

    if (qtyVal) {
        qtyVal.innerText = "1";
    }
}


/* =========================================================
   AGREGAR AL CARRITO
========================================================= */

function agregarAlCarrito(nombre, precio, cantidad = 1, manual = false) {

    const precioNum = Number(precio);

    const itemExistente =
        carrito.find(item => item.nombre === nombre && item.precio === precioNum);

    if (itemExistente) {

        itemExistente.cantidad += cantidad;

    } else {

        carrito.push({

            nombre: nombre,

            precio: precioNum,

            cantidad: cantidad,

            manual: !!manual

        });
    }

    actualizarCarritoUI();

    actualizarBotonCarrito();
}


/* =========================================================
   CAMBIAR CANTIDAD DESDE EL CARRITO
========================================================= */

function cambiarCantidad(index, cambio) {

    if (!carrito[index]) return;

    carrito[index].cantidad += cambio;

    if (carrito[index].cantidad <= 0) {

        carrito.splice(index, 1);
    }

    actualizarCarritoUI();

    actualizarBotonCarrito();
}


/* =========================================================
   VACIAR CARRITO
========================================================= */

function vaciarCarrito() {

    carrito = [];

    actualizarCarritoUI();

    actualizarBotonCarrito();
}


/* =========================================================
   ACTUALIZAR CARRITO
========================================================= */

function actualizarCarritoUI() {

    actualizarBadgesMenu();

    const container =
        document.getElementById("cart-items");

    const totalEl =
        document.getElementById("cart-total");

    if (!container || !totalEl) return;

    if (carrito.length === 0) {

        container.innerHTML =
            '<p class="empty-msg">El carrito está vacío.</p>';

        totalEl.innerText = "$0";

        return;
    }

    let html = "";

    let total = 0;

    carrito.forEach(function(item, index) {

        const subtotal =
            item.precio * item.cantidad;

        total += subtotal;

        html += `

            <div class="cart-item-row">

                <div class="cart-item-info">

                    <strong>
                        ${item.nombre}
                    </strong>

                    <span>

                        $${item.precio.toLocaleString("es-AR")}

                        x ${item.cantidad}

                        =

                        $${subtotal.toLocaleString("es-AR")}

                    </span>

                </div>

                <div class="cart-item-controls">

                    <button
                        class="btn-qty"
                        onclick="cambiarCantidad(${index}, -1)"
                    >
                        -
                    </button>

                    <span>
                        ${item.cantidad}
                    </span>

                    <button
                        class="btn-qty"
                        onclick="cambiarCantidad(${index}, 1)"
                    >
                        +
                    </button>

                </div>

            </div>

        `;
    });

    container.innerHTML = html;

    totalEl.innerText =
        "$" + total.toLocaleString("es-AR");
}

/* =========================================================
   MENÚ DEL DÍA DESDE GOOGLE SHEETS
========================================================= */

const URL_MENU =
"https://script.google.com/macros/s/AKfycby9nZR0UMXbHR71rsV4k6y5iZi_IuptX5CJHQqyQEvfs0D7_4__kD-tnKToRggo1B5W/exec";


async function cargarMenuDesdeGoogle() {

    try {

        const respuesta =
            await fetch(URL_MENU);

        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP: " + respuesta.status
            );
        }

        const datos =
            await respuesta.json();

        if (!datos.menu_dia) {

            throw new Error(
                "No existe menu_dia en la respuesta"
            );
        }

        const menu =
            datos.menu_dia;

        const data = menuLoad();

        const producto = data.products.find(function (p) {
            return p.name === "Menú del Día";
        });

        if (producto) {

            if (menu.detalle) {
                producto.desc = menu.detalle;
            }

            if (menu.precio) {
                producto.price = Number(menu.precio);
            }

            menuSave(data);
            renderMenuPagina();
        }

    } catch (error) {

        console.error(
            "Error cargando menú del día:",
            error
        );
    }
}


/* =========================================================
   CONTROL ANTI-DOBLE IMPRESIÓN
========================================================= */

let impresionEnCurso = false;


/* =========================================================
   IMPRIMIR COMANDA
========================================================= */

function imprimirComanda() {

    if (impresionEnCurso) {

        console.warn(
            "Impresión bloqueada: ya hay una impresión en curso."
        );

        return;
    }


    if (carrito.length === 0) {

        alert("El carrito está vacío.");

        return;
    }


    let nombre, tipoEntrega, direccion, horario, pago, notas;

    if (modoVenta === "salon") {

        const pagoSalonEl =
            document.getElementById("salon-pago");

        nombre = "Salón";
        tipoEntrega = "Salón";
        direccion = "";

        const ahoraSalon = new Date();
        horario = ahoraSalon.toLocaleTimeString(
            "es-AR",
            { hour: "2-digit", minute: "2-digit", hour12: false }
        );

        pago = pagoSalonEl ? pagoSalonEl.value : "Efectivo";
        notas = "";

    } else {

        const nombreEl =
            document.getElementById("cliente-nombre");

        const entregaEl =
            document.getElementById("cliente-entrega");

        const direccionEl =
            document.getElementById("cliente-direccion");

        const horarioEl =
            document.getElementById("cliente-horario");

        const pagoEl =
            document.getElementById("cliente-pago");

        const notasEl =
            document.getElementById("cliente-notas");


        nombre =
            nombreEl
                ? nombreEl.value.trim()
                : "";


        tipoEntrega =
            entregaEl
                ? entregaEl.value
                : "";


        direccion =
            direccionEl
                ? direccionEl.value.trim()
                : "";


        horario =
            horarioEl
                ? horarioEl.value.trim()
                : "";


        pago =
            pagoEl
                ? pagoEl.value
                : "";


        notas =
            notasEl
                ? notasEl.value.trim()
                : "";


        /* =====================================================
           VALIDACIONES (solo aplican al modo Pedido)
        ===================================================== */

        if (!nombre) {

            alert(
                "Ingresá el nombre del cliente."
            );

            if (nombreEl) {
                nombreEl.focus();
            }

            return;
        }


        if (
            tipoEntrega === "Delivery"
            &&
            !direccion
        ) {

            alert(
                "Ingresá la dirección."
            );

            if (direccionEl) {
                direccionEl.focus();
            }

            return;
        }


        if (!horario) {

            alert(
                "Indicá el horario."
            );

            if (horarioEl) {
                horarioEl.focus();
            }

            return;
        }
    }


    impresionEnCurso = true;


    /* =====================================================
       FECHA Y HORA
    ===================================================== */

    const ahora =
        new Date();


    const horaPedido =
        ahora.toLocaleTimeString(
            "es-AR",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );


    const fechaPedido =
        ahora.toLocaleDateString(
            "es-AR"
        );


    /* =====================================================
       PRODUCTOS
    ===================================================== */

    let total = 0;

    let productosTexto = "";


    carrito.forEach(function(item) {

        const subtotal =
            item.precio *
            item.cantidad;


        total += subtotal;


        let nombreProd =
            item.nombre
                .replace(/á/g, "a")
                .replace(/é/g, "e")
                .replace(/í/g, "i")
                .replace(/ó/g, "o")
                .replace(/ú/g, "u")
                .replace(/ñ/g, "n");


        const precioTexto =
            "$" +
            subtotal.toLocaleString("es-AR");


        productosTexto +=
            `${item.cantidad} x ${nombreProd}    ${precioTexto}\n`;

    });

    /* =====================================================
       REGISTRAR VENTA EN CAJA / ESTADO DE PAGO
    ===================================================== */

    let esPendiente = (pago.toLowerCase() === "pendiente");

    if (!esPendiente) {
        cajaRegistrarVentaDesdePedido({
            nombre: nombre,
            tipoEntrega: tipoEntrega,
            pago: pago,
            total: total,
            items: carrito.map(function (item) {
                return { nombre: item.nombre, precio: item.precio, cantidad: item.cantidad, manual: !!item.manual };
            })
        });
    }

    cajaCrearComanda({
        origen: "pedido",
        referencia: nombre,
        tipoEntrega: tipoEntrega,
        direccion: direccion,
        pago: pago,
        estadoPago: esPendiente ? "pendiente" : "cobrado",
        notas: notas,
        items: carrito.map(function (item) {
            return { nombre: item.nombre, precio: item.precio, cantidad: item.cantidad, manual: !!item.manual };
        })
    });

    /* =====================================================
       CONSTRUIR TICKET
    ===================================================== */

    const tituloTicket = modoVenta === "salon" ? "VENTA SALON" : "COMANDA";

    let ticket = `

     MYCFOODS
       ${tituloTicket}
--------------------------------
FECHA: ${fechaPedido}
HORA:  ${horaPedido}
--------------------------------
CLIENTE: ${nombre.toUpperCase()}
ENTREGA: ${tipoEntrega.toUpperCase()}
`;


    if (tipoEntrega === "Delivery") {

        ticket +=
`DIRECCION:
${direccion.toUpperCase()}
`;
    }


    ticket +=
`HORARIO: ${horario}
PAGO:    ${pago}
--------------------------------
PEDIDO:
${productosTexto}--------------------------------
TOTAL: $${total.toLocaleString("es-AR")}
`;


    if (notas) {

        ticket +=
`--------------------------------
OBSERVACIONES:
${notas.toUpperCase()}
`;
    }


    ticket +=
`--------------------------------
     MYCFOODS


`;


    /* =====================================================
       TICKET DE COCINA (sin precios ni forma de pago)
    ===================================================== */

    let productosSinPrecio = "";

    carrito.forEach(function(item) {

        let nombreProd =
            item.nombre
                .replace(/á/g, "a")
                .replace(/é/g, "e")
                .replace(/í/g, "i")
                .replace(/ó/g, "o")
                .replace(/ú/g, "u")
                .replace(/ñ/g, "n");

        productosSinPrecio +=
            `${item.cantidad} x ${nombreProd}\n`;

    });

    let ticketCocina = `

     MYCFOODS
     PARA COCINA
--------------------------------
HORA PEDIDO: ${horaPedido}
`;

    if (modoVenta !== "salon") {
        ticketCocina += `HORA ENTREGA: ${horario}\n`;
    }

    ticketCocina +=
`CLIENTE: ${nombre.toUpperCase()}
ENTREGA: ${tipoEntrega.toUpperCase()}
`;

    if (tipoEntrega === "Delivery") {
        ticketCocina +=
`DIRECCION:
${direccion.toUpperCase()}
`;
    }

    ticketCocina +=
`--------------------------------
PEDIDO:
${productosSinPrecio}--------------------------------
`;

    if (notas) {
        ticketCocina +=
`OBSERVACIONES:
${notas.toUpperCase()}
--------------------------------
`;
    }

    ticketCocina +=
`     MYCFOODS


`;


    /* =====================================================
       VENTANA DE IMPRESIÓN — imprime primero el ticket de
       caja (con precios) y, al cerrarse, el de cocina
    ===================================================== */

    imprimirTicketEnVentana(ticket, function() {
        imprimirTicketEnVentana(ticketCocina, function() {
            impresionEnCurso = false;
            vaciarCarrito();
            limpiarFormularioCliente();
        });
    });
}    

function imprimirTicketEnVentana(textoTicket, alTerminar) {

    const ventana =
        window.open(
            "",
            "_blank",
            "width=400,height=600"
        );


    if (!ventana) {

        alert(
            "El navegador bloqueó la ventana de impresión."
        );

        if (alTerminar) alTerminar();

        return;
    }


    ventana.document.open();

    ventana.document.write(`

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ticket MYCFOODS</title>

    <style>
        @page {
            size: 80mm auto;
            margin: 0;
        }

        html,
        body {
            width: 80mm;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            padding: 2mm 3mm;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.25;
            color: #000000;
            text-align: left;
        }

        .ticket-container {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
        }

        @media print {
            html,
            body {
                width: 80mm;
                margin: 0;
                padding: 0;
            }

            body {
                padding: 2mm 3mm;
                text-align: left;
            }

            .ticket-container {
                width: 100%;
                margin: 0;
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div class="ticket-container">${textoTicket}</div>
</body>

</html>`);

    ventana.document.close();

    setTimeout(function() {

        try {

            ventana.focus();

            ventana.print();

        } catch (error) {

            console.error(
                "Error de impresión:",
                error
            );

        }


        setTimeout(function() {

            try {
                ventana.close();
            } catch (e) {}

            if (alTerminar) alTerminar();

        }, 1200);

    }, 300);
}
